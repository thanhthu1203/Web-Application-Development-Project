<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — Forum HCMIU</title>
  <link rel="stylesheet" href="../css/user.css"/>
</head>
<body>

<div id="forumScreen" class="forum-layout">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-icon small">◈</span>
      <span class="topbar-title">Forum HCMIU</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="chip-avatar user" id="chipAvatar"></div>
        <span id="chipName"></span>
        <span class="role-tag user" id="chipRole">User</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="forum-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-label">User Menu</div>
        <div class="nav-item" data-tab="threads" onclick="window.location.href='user_threads.html'">
          <span class="nav-icon">◫</span>Threads
        </div>
        <div class="nav-item active" data-tab="messages" onclick="window.location.href='user_messages.html'">
          <span class="nav-icon">✉</span>Messages
        </div>
        <div class="nav-item" data-tab="notifications" onclick="window.location.href='user_notifications.html'">
          <span class="nav-icon">◎</span>Notifications
        </div>
        <div class="nav-item" data-tab="subscribes" onclick="window.location.href='user_subscribes.html'">
          <span class="nav-icon">★</span>Subscriptions
        </div>
        <div class="nav-item" data-tab="profile" onclick="window.location.href='user_profile.html'">
          <span class="nav-icon">👤</span>Profile
        </div>
      </nav>
    </aside>

    <main class="main-content" id="mainContent">
      <div id="page-messages" class="page-section">
        <div class="page-title">Posts</div>
        <div class="page-desc">All posts in the forum</div>
        <div class="perm-banner user">ℹ️ You are <strong>User</strong> — read posts, create posts, subscribe to threads.</div>
        <div id="messagesList"></div>
        <div class="card" style="margin-top:1rem">
          <div class="card-title">Create New Post</div>
          <select id="threadSelect"></select>
          <div class="compose-box">
            <input class="compose-input" id="msgInput" placeholder="Enter content...">
            <button class="btn success" onclick="postMessage()">Post</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<template id="tpl-message">
  <div class="thread-item">
    <div class="thread-icon-box" style="font-size:11px"></div>
    <div class="thread-info">
      <div class="thread-title" style="font-size:13px"></div>
      <div class="thread-meta">
        <span class="meta-user"></span>
        <span class="meta-dot"></span>
        <span class="meta-thread"></span>
        <span class="meta-dot"></span>
        <span class="meta-date"></span>
      </div>
    </div>
    <div class="thread-actions">
      <button class="btn btn-comments" style="font-size:11px;">💬 Comments</button>
    </div>
  </div>
</template>

<template id="tpl-empty">
  <div class="empty-state">
    <div class="empty-icon"></div>
    <div class="empty-text"></div>
  </div>
</template>

<!-- Modal xem bài + bình luận -->
<div id="commentModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:16px; width:600px; max-width:95vw; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.18);">
    <div style="padding:1.25rem 1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:700; font-size:15px;">Post & Comments</span>
      <button onclick="closeCommentModal()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-muted);">✕</button>
    </div>
    <div id="modalOriginalPost" style="padding:1.25rem 1.5rem; border-bottom:1px solid var(--border); background:var(--bg);"></div>
    <div id="modalCommentsList" style="flex:1; overflow-y:auto; padding:1rem 1.5rem; display:flex; flex-direction:column; gap:10px;"></div>
    <div style="padding:1rem 1.5rem; border-top:1px solid var(--border); display:flex; gap:8px;">
      <input id="commentInput" class="compose-input" placeholder="Write a comment..." style="flex:1;">
      <button class="btn success" onclick="submitComment()">Comment</button>
    </div>
  </div>
</div>

<template id="tpl-comment">
  <div class="comment-item" style="display:flex; gap:10px; align-items:flex-start;">
    <div class="comment-avatar" style="width:28px; height:28px; border-radius:50%; background:var(--primary-light); color:var(--primary-text); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex-shrink:0;"></div>
    <div style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:8px 12px;">
      <div class="comment-author" style="font-weight:700; font-size:12px; margin-bottom:3px;"></div>
      <div class="comment-content" style="font-size:13px; color:var(--text);"></div>
      <div class="comment-date" style="font-size:11px; color:var(--text-muted); margin-top:4px;"></div>
    </div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script src="../js/common.js"></script>
<script src="../js/page_router.js"></script>
<script>window.__ACTIVE_TAB__ = 'messages';</script>
<script src="../user/js/user_messages.js"></script>
</body>
</html>
