<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Forum HCMIU</title>
  <link rel="stylesheet" href="../frontend/css/shared.css"/>
  <link rel="stylesheet" href="../frontend/css/login.css"/>
</head>
<body>

  <main class="main">
    <div class="auth-wrap">

      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Sign in to continue participating in the community</p>
      </div>

      <div class="auth-card">

        <!-- Banner lỗi từ server (ẩn mặc định) -->
        <div class="error-banner" id="errorBanner">
          <span id="errorMsg">Invalid email or password.</span>
        </div>

        <form id="loginForm" novalidate>

          <div class="form-group">
            <label for="email">Email or username</label>
            <div class="input-wrap">
              <span class="input-icon">@</span>
              <input type="text" id="email" placeholder="nguyen@example.com" autocomplete="username"/>
            </div>
            <div class="error-msg" id="emailErr">Please enter your email or username.</div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <span class="input-icon">🔑</span>
              <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">👁</button>
            </div>
            <div class="error-msg" id="pwErr">Please enter your password.</div>
          </div>

          <div class="check-row">
            <input type="checkbox" id="remember"/>
            <label for="remember">Remember me</label>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">Login</button>

        </form>

        <div class="redirect">
          Don't have an account? <a href="sign_up.html">Sign up now</a>
        </div>

        <div class="divider">or sign in with</div>

        <div class="social-row">
          <button class="btn-social" onclick="socialLogin('Google')" type="button">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>

          <button class="btn-social" onclick="socialLogin('Facebook')" type="button">
            <svg fill="#0866ff" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2.03998C6.5 2.03998 2 6.52998 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.84998C10.44 7.33998 11.93 5.95998 14.22 5.95998C15.31 5.95998 16.45 6.14998 16.45 6.14998V8.61998H15.19C13.95 8.61998 13.56 9.38998 13.56 10.18V12.06H16.34L15.89 14.96H13.56V21.96C15.9164 21.5878 18.0622 20.3855 19.6099 18.57C21.1576 16.7546 22.0054 14.4456 22 12.06C22 6.52998 17.5 2.03998 12 2.03998Z"/>
            </svg>
            Facebook
          </button>

          <button class="btn-social" onclick="socialLogin('LinkedIn')" type="button">
            <svg fill="#0a66c2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
            LinkedIn
          </button>

          <button class="btn-social" onclick="socialLogin('GitHub')" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            GitHub
          </button>
        </div>

      </div>
    </div>
  </main>

  <script src="../frontend/js/login.js"></script>
</body>
</html>
