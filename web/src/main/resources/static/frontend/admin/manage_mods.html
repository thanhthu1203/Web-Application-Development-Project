<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Mods — Admin Portal — Forum HCMIU</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../admin/css/admin.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<div id="forumScreen" class="forum-layout" style="display: flex;">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-icon small">◈</span>
      <span class="topbar-title">Forum HCMIU - Admin Control Panel</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="chip-avatar admin" id="chipAvatar"></div>
        <span id="chipName"></span>
        <span class="role-tag admin" id="chipRole">Admin</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="forum-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-label">Admin Menu</div>
        <div class="nav-item" data-tab="system-settings" onclick="window.location.href='system_settings.html'">
          <span class="nav-icon">⚙</span>System Settings
        </div>
        <div class="nav-item active" data-tab="manage-mods" onclick="window.location.href='manage_mods.html'">
          <span class="nav-icon">◈</span>Manage Mods
        </div>
        <div class="nav-item" data-tab="profile" onclick="window.location.href='admin_profile.html'">
          <span class="nav-icon">👤</span>Profile
        </div>
      </nav>
    </aside>

    <main class="main-content" id="mainContent">
      <div id="page-manage-mods" class="page-section">
        <div class="page-title">Manage Moderators</div>
        <div class="page-desc">Admin manages moderators</div>
        <div class="perm-banner admin">ℹ️ You are <strong>Admin</strong> — Manage Moderators and System Settings.</div>
        <button class="btn primary" style="margin-bottom:1rem" onclick="openAddModModal()">+ Add Moderator</button>
        <div class="card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Managed by</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody id="modTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Modal thêm Moderator -->
      <div id="addModModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999;">
        <div style="background: white; padding: 2rem; border-radius: 8px; width: 90%; max-width: 500px;">
        <h3 style="margin-top: 0;">Add New Moderator</h3>
    
          <div style="margin-bottom: 1rem;">
            <label for="modEmail" style="display: block; margin-bottom: 0.5rem;">Email:</label>
            <input id="modEmail" type="email" placeholder="moderator@example.com" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
          </div>

          <div style="margin-bottom: 1rem;">
            <label for="modUsername" style="display: block; margin-bottom: 0.5rem;">Username:</label>
            <input id="modUsername" type="text" placeholder="mod_username" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
          </div>

          <div style="margin-bottom: 1rem;">
            <label for="modName" style="display: block; margin-bottom: 0.5rem;">Full Name:</label>
            <input id="modName" type="text" placeholder="John Doe" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
          </div>

    <div style="margin-bottom: 1.5rem;">
      <label for="modPassword" style="display: block; margin-bottom: 0.5rem;">Password (Optional - system will generate if left blank):</label>
      <input id="modPassword" type="password" placeholder="Leave blank for auto-generate" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
      <button onclick="closeAddModModal()" style="padding: 0.5rem 1rem; background: #ccc; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
      <button onclick="submitAddMod()" style="padding: 0.5rem 1rem; background: #e91e63; color: white; border: none; border-radius: 4px; cursor: pointer;">Create Moderator</button>
    </div>
  </div>
</div>
    </main>
  </div>
</div>

<template id="tpl-mod-row">
  <tr>
    <td class="mod-name"></td>
    <td class="mod-email" style="color:var(--text-muted)"></td>
    <td>Super Admin</td>
    <td style="text-align:right;">
      <button class="btn danger btn-delete">Delete</button>
    </td>
  </tr>
</template>

<template id="tpl-empty">
  <div class="empty-state">
    <div class="empty-icon"></div>
    <div class="empty-text"></div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script src="../js/common.js"></script>
<script src="../js/page_router.js"></script>
<script>window.__ACTIVE_TAB__ = 'manage-mods';</script>
<script src="../admin/js/manage_mods.js"></script>
</body>
</html>
