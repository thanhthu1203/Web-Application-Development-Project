<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Reports — Moderator Portal — Forum HCMIU</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="css/mod.css">
  <link rel="stylesheet" href="css/mod_reports.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<div id="forumScreen" class="forum-layout" style="display: flex;">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-icon small">◈</span>
      <span class="topbar-title">Forum HCMIU - Moderator</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="chip-avatar mod" id="chipAvatar"></div>
        <span id="chipName"></span>
        <span class="role-tag mod" id="chipRole">Moderator</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="forum-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-label">Moderator Menu</div>
        <div class="nav-item" data-tab="threads" onclick="window.location.href='mod_threads.html'">
          <span class="nav-icon">◫</span>Manage Threads
        </div>
        <div class="nav-item" data-tab="messages" onclick="window.location.href='mod_messages.html'">
          <span class="nav-icon">✉</span>Manage Messages
        </div>
        <div class="nav-item" data-tab="manage-users" onclick="window.location.href='manage_users.html'">
          <span class="nav-icon">◉</span>Ban/Unban Users
        </div>
        <div class="nav-item" data-tab="ban-history" onclick="window.location.href='ban_history.html'">
          <span class="nav-icon">⊘</span>Ban History
        </div>
        <div class="nav-item active" data-tab="manage-reports" onclick="window.location.href='mod_reports.html'">
          <span class="nav-icon">🚩</span>Manage Reports
        </div>
        <div class="nav-item" data-tab="profile" onclick="window.location.href='mod_profile.html'">
          <span class="nav-icon">👤</span>Profile
        </div>
      </nav>
    </aside>

    <main class="main-content" id="mainContent">
      <div id="page-reports" class="page-section">
        <div class="page-title">Manage Reports</div>
        <div class="page-desc">Review reported posts from users. You can delete the post or dismiss the report.</div>

        <!-- Thanh filter trạng thái -->
        <div class="report-filter-bar">
          <button class="report-filter-btn active" data-filter="all" onclick="filterReports('all')">
            All <span class="filter-count" id="count-all">0</span>
          </button>
          <button class="report-filter-btn" data-filter="Pending" onclick="filterReports('Pending')">
            🕐 Pending <span class="filter-count" id="count-pending">0</span>
          </button>
          <button class="report-filter-btn" data-filter="Resolved" onclick="filterReports('Resolved')">
            ✅ Resolved <span class="filter-count" id="count-resolved">0</span>
          </button>
          <button class="report-filter-btn" data-filter="Dismissed" onclick="filterReports('Dismissed')">
            ✗ Dismissed <span class="filter-count" id="count-dismissed">0</span>
          </button>
        </div>

        <div id="reportsList"></div>
      </div>
    </main>
  </div>
</div>

<!-- Template: report card -->
<template id="tpl-report-card">
  <div class="report-card">
    <div class="report-header">
      <div class="report-meta-left">
        <span class="report-id"></span>
        <span class="report-date"></span>
      </div>
      <span class="report-status-badge"></span>
    </div>

    <!-- Nội dung bài viết bị report -->
    <div class="report-post-box">
      <div class="report-post-label">📄 Reported post</div>
      <div class="report-post-author"></div>
      <div class="report-post-thread"></div>
      <div class="report-post-content"></div>
    </div>

    <!-- Thông tin report -->
    <div class="report-info-row">
      <div class="report-info-item">
        <span class="report-info-label">🚩 Reason</span>
        <span class="report-reason"></span>
      </div>
      <div class="report-info-item">
        <span class="report-info-label">👤 Reported by</span>
        <span class="report-reporter"></span>
      </div>
      <div class="report-info-item report-resolver-row" style="display:none;">
        <span class="report-info-label">✅ Resolved by</span>
        <span class="report-resolver"></span>
      </div>
      <div class="report-info-item report-resolved-at-row" style="display:none;">
        <span class="report-info-label">🕒 Resolved at</span>
        <span class="report-resolved-at"></span>
      </div>
    </div>

    <!-- Nút hành động (chỉ hiện khi Pending) -->
    <div class="report-actions" style="display:none;">
      <button class="btn danger btn-resolve-delete">🗑 Delete Post</button>
      <button class="btn btn-resolve-dismiss">✓ Dismiss</button>
    </div>
  </div>
</template>

<!-- Template: empty state -->
<template id="tpl-empty">
  <div class="empty-state">
    <div class="empty-icon"></div>
    <div class="empty-text"></div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script src="../js/common.js"></script>
<script src="../js/page_router.js"></script>
<script>window.__ACTIVE_TAB__ = 'manage-reports';</script>
<script src="js/mod_reports.js"></script>
</body>
</html>
