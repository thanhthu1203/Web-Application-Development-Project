<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile — Moderator Portal — Forum HCMIU</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="css/mod.css">
  <link rel="stylesheet" href="css/mod_avatar.css">
</head>
<body>
<div id="forumScreen" class="forum-layout" style="display: flex;">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-icon small">◈</span>
      <span class="topbar-title">Forum HCMIU - Moderator</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="chip-avatar mod" id="chipAvatar"></div>
        <span id="chipName"></span>
        <span class="role-tag mod" id="chipRole">Moderator</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="forum-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-label">Moderator Menu</div>
        <div class="nav-item" data-tab="threads" onclick="window.location.href='mod_threads.html'"><span class="nav-icon">◫</span>Manage Threads</div>
        <div class="nav-item" data-tab="messages" onclick="window.location.href='mod_messages.html'"><span class="nav-icon">✉</span>Manage Messages</div>
        <div class="nav-item" data-tab="manage-users" onclick="window.location.href='manage_users.html'"><span class="nav-icon">◉</span>Ban/Unban Users</div>
        <div class="nav-item" data-tab="ban-history" onclick="window.location.href='ban_history.html'"><span class="nav-icon">⊘</span>Ban History</div>
        <div class="nav-item active" data-tab="profile" onclick="window.location.href='mod_profile.html'"><span class="nav-icon">👤</span>Profile</div>
      </nav>
    </aside>

    <main class="main-content" id="mainContent">
      <div id="page-profile" class="page-section">
        <div class="page-title">Profile</div>
        <div class="page-desc">Your account information</div>
        <div class="card" style="max-width:520px">
          <div class="card-title">Profile Information</div>
          
          <div class="avatar-section">
            <label>Profile Picture</label>
            <div class="avatar-row">
              <div class="avatar-preview" id="pf-avatarPreview"></div>
              <div>
                <input type="file" id="pf-avatarInput" accept="image/*" style="display: none"/>
                <button type="button" class="btn" onclick="document.getElementById('pf-avatarInput').click()">Change Avatar</button>
              </div>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1rem;">
            <label>Username</label>
            <input id="pf-username" placeholder="Username" class="compose-input" style="width: 100%;">
          </div>

          <div class="form-group" style="margin-bottom: 1rem;">
            <label>First Name</label>
            <input id="pf-first" placeholder="First Name" class="compose-input" style="width: 100%;">
          </div>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label>Last Name</label>
            <input id="pf-last" placeholder="Last Name" class="compose-input" style="width: 100%;">
          </div>
          <div class="form-group">
            <label for="pf-email">Email Address</label>
            <input type="email" id="pf-email" class="compose-input" style="width: 100%; background-color: #f5f5f5; cursor: not-allowed;" placeholder="Loading..." readonly/>
            <small class="form-text text-muted">Email cannot be changed</small>
          </div>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label>Gender</label>
            <select id="pf-gender" class="compose-input" style="width: 100%;">
              <option value="">-- Select --</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label>Date of Birth</label>
            <input type="date" id="pf-dob" class="compose-input" style="width: 100%;">
          </div>
          <button class="btn success" onclick="saveProfile()">Save Changes</button>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/common.js"></script>
<script src="../js/page_router.js"></script>
<script>window.__ACTIVE_TAB__ = 'profile';</script>
<script src="js/mod_profile.js"></script>
</body>
</html>
