<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ban/Unban Users — Moderator Portal — Forum HCMIU</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="css/mod.css">
</head>
<body>

<div id="forumScreen" class="forum-layout" style="display: flex;">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-icon small">◈</span>
      <span class="topbar-title">Forum HCMIU - Moderator</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="chip-avatar mod" id="chipAvatar"></div>
        <span id="chipName"></span>
        <span class="role-tag mod" id="chipRole">Moderator</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="forum-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-label">Moderator Menu</div>
        <div class="nav-item" data-tab="threads" onclick="window.location.href='mod_threads.html'">
          <span class="nav-icon">◫</span>Manage Threads
        </div>
        <div class="nav-item" data-tab="messages" onclick="window.location.href='mod_messages.html'">
          <span class="nav-icon">✉</span>Manage Messages
        </div>
        <div class="nav-item active" data-tab="manage-users" onclick="window.location.href='manage_users.html'">
          <span class="nav-icon">◉</span>Ban/Unban Users
        </div>
        <div class="nav-item" data-tab="ban-history" onclick="window.location.href='ban_history.html'">
          <span class="nav-icon">⊘</span>Ban History
        </div>
        <div class="nav-item" data-tab="profile" onclick="window.location.href='mod_profile.html'">
          <span class="nav-icon">👤</span>Profile
        </div>
      </nav>
    </aside>

    <main class="main-content" id="mainContent">
      <div id="page-manage-users" class="page-section">
        <div class="page-title">Manage Users</div>
        <div class="card">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Email</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<template id="tpl-user-row">
  <tr>
    <td class="u-name"></td>
    <td class="u-email" style="color:var(--text-muted)"></td>
    <td class="u-status">
      <span class="status-badge"><span class="status-dot"></span><span class="status-text"></span></span>
    </td>
    <td style="text-align:right;"><button class="btn btn-ban-action"></button></td>
  </tr>
</template>

<template id="tpl-empty">
  <div class="empty-state">
    <div class="empty-icon"></div>
    <div class="empty-text"></div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script src="../js/common.js"></script>
<script src="../js/page_router.js"></script>
<script>window.__ACTIVE_TAB__ = 'manage-users';</script>
<script src="js/mod_manage_users.js"></script>
</body>
</html>
