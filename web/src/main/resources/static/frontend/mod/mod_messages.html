<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — Moderator Portal — Forum HCMIU</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/mod.css">
</head>
<body>

<div id="forumScreen" class="forum-layout" style="display: flex;">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-icon small">◈</span>
      <span class="topbar-title">Forum HCMIU - Moderator</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="chip-avatar mod" id="chipAvatar"></div>
        <span id="chipName"></span>
        <span class="role-tag mod" id="chipRole">Moderator</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="forum-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-label">Moderator Menu</div>
        <div class="nav-item" data-tab="threads" onclick="window.location.href='mod_threads.html'">
          <span class="nav-icon">◫</span>Manage Threads
        </div>
        <div class="nav-item active" data-tab="messages" onclick="window.location.href='mod_messages.html'">
          <span class="nav-icon">✉</span>Manage Messages
        </div>
        <div class="nav-item" data-tab="manage-users" onclick="window.location.href='manage_users.html'">
          <span class="nav-icon">◉</span>Ban/Unban Users
        </div>
        <div class="nav-item" data-tab="ban-history" onclick="window.location.href='ban_history.html'">
          <span class="nav-icon">⊘</span>Ban History
        </div>
        <div class="nav-item" data-tab="profile" onclick="window.location.href='mod_profile.html'">
          <span class="nav-icon">👤</span>Profile
        </div>
      </nav>
    </aside>

    <main class="main-content" id="mainContent">
      <div id="page-messages" class="page-section">
        <div class="page-title">Messages Management</div>
        <div id="modMessagesList"></div>
      </div>
    </main>
  </div>
</div>

<template id="tpl-message-mod">
  <div class="thread-item message-item">
    <div class="thread-icon-box" style="font-size:11px"></div>
    <div class="thread-info">
      <div class="thread-title message-content" style="font-size:13px"></div>
      <div class="thread-meta">
        <span class="meta-user"></span> <span class="meta-dot"></span>
        <span class="meta-thread"></span> <span class="meta-dot"></span>
        <span class="meta-date"></span>
      </div>
    </div>
    <div class="thread-actions message-actions">
      <button class="btn btn-edit">Edit</button>
      <button class="btn danger btn-delete">Delete</button>
    </div>
  </div>
</template>

<template id="tpl-empty">
  <div class="empty-state">
    <div class="empty-icon"></div>
    <div class="empty-text"></div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script src="../js/common.js"></script>
<script src="../js/page_router.js"></script>
<script>window.__ACTIVE_TAB__ = 'messages';</script>
<script src="../mod/js/mod_messages.js"></script>
</body>
</html>
